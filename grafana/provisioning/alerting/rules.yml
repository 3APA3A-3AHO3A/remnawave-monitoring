# Правила алертов. Пороги берутся из .env (${VAR}).
# Каждое выражение возвращает 1 для каждой проблемной ноды/хоста,
# поэтому условие везде одно: «значение больше 0».
apiVersion: 1
groups:
- orgId: 1
  name: remnawave
  folder: Remnawave
  interval: 1m
  rules:
  - uid: rwmon-clients-dropped
    title: Клиенты пропали с ноды
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: rwmon-prometheus
      model:
        refId: A
        expr: |-
          (
            (
              max_over_time(remnawave_node_online_users[5m]) <= ${CLIENTS_DROP_MAX_NOW}
              and on (node_uuid) avg_over_time(remnawave_node_online_users[1h] offset 10m) >= ${CLIENTS_DROP_MIN_AVG}
              and on (node_uuid) remnawave_node_status == 1
            ) * 0 + 1
          ) * on (node_uuid) group_left (node_name) topk by (node_uuid) (1, remnawave_node_basic_info)
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Клиенты пропали с ноды
      description: Нода подключена к панели, но клиентов на ней почти не осталось, хотя час назад были. Возможна блокировка IP ноды.
    isPaused: false
  - uid: rwmon-xray-down
    title: Xray не принимает клиентов
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: rwmon-prometheus
      model:
        refId: A
        expr: (xray_proxy_status{job="xray-checker", check="xray"} == 0) * 0 + 1
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 6m
    labels:
      severity: critical
    annotations:
      summary: Нода не принимает клиентов
      description: Проверка подключается к хосту как обычный клиент и не может открыть страницу. Две проверки подряд.
    isPaused: false
  - uid: rwmon-warp-down
    title: WARP не работает
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: rwmon-prometheus
      model:
        refId: A
        expr: ((xray_proxy_status{job="xray-checker", check="warp"} == 0) unless on (name) (xray_proxy_status{job="xray-checker", check="xray"} == 0)) * 0 + 1
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 6m
    labels:
      severity: critical
    annotations:
      summary: WARP не работает
      description: Через ноду не открывается адрес, который она отправляет в WARP. Две проверки подряд.
    isPaused: false
  - uid: rwmon-psiphon-down
    title: Psiphon не работает
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: rwmon-prometheus
      model:
        refId: A
        expr: ((xray_proxy_status{job="xray-checker", check="psiphon"} == 0) unless on (name) (xray_proxy_status{job="xray-checker", check="xray"} == 0)) * 0 + 1
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 6m
    labels:
      severity: critical
    annotations:
      summary: Psiphon не работает
      description: 'Через ноду не открывается адрес, который она отправляет в Psiphon: Gemini на этой ноде не работает. Две проверки подряд.'
    isPaused: false
  - uid: rwmon-outbound-no-response
    title: Аутбаунд не отвечает
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 1800
        to: 0
      datasourceUid: rwmon-prometheus
      model:
        refId: A
        expr: |-
          (
            (
              sum by (node_uuid, tag) (increase(remnawave_node_outbound_upload_bytes{tag=~"${OUTBOUND_TAGS}"}[15m])) > 20480
              and on (node_uuid, tag)
              sum by (node_uuid, tag) (increase(remnawave_node_outbound_download_bytes{tag=~"${OUTBOUND_TAGS}"}[15m])) < 0.1 * sum by (node_uuid, tag) (increase(remnawave_node_outbound_upload_bytes{tag=~"${OUTBOUND_TAGS}"}[15m]))
            ) * 0 + 1
          ) * on (node_uuid) group_left (node_name) topk by (node_uuid) (1, remnawave_node_basic_info)
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Аутбаунд не отвечает клиентам
      description: За 15 минут клиенты отправили запросы в этот аутбаунд, а ответов почти нет.
    isPaused: false
  - uid: rwmon-panel-metrics
    title: Нет метрик панели
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: rwmon-prometheus
      model:
        refId: A
        expr: (up{job="remnawave"} == 0) * 0 + 1
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: Prometheus не может получить метрики панели
      description: Проверьте, что панель работает и что RW_METRICS_PORT / USER / PASS в .env совпадают с настройками панели.
    isPaused: false
  - uid: rwmon-checker-down
    title: Не работает проверка хостов
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: rwmon-prometheus
      model:
        refId: A
        expr: (up{job="xray-checker"} == 0) * 0 + 1
        instant: true
        range: false
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Контейнер проверки хостов не отвечает
      description: 'Посмотрите логи: docker compose logs --tail 50 checker-xray checker-warp checker-psiphon'
    isPaused: false
