# remnawave-monitoring
# Все контейнеры работают в сети хоста и слушают только 127.0.0.1:
# наружу ничего не открывается, Grafana отдаёт nginx.
#
# Настройки панелей, Telegram и проверок — в config.toml,
# порты и логин Grafana — в .env. После изменений: ./apply.sh

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-checker: &checker
  # xray-checker v1.3.1 + исправление для Hysteria2 (см. checker/Dockerfile)
  build: ./checker
  image: rwmon-xray-checker:local
  network_mode: host
  restart: unless-stopped
  depends_on:
    config: { condition: service_completed_successfully }
    reporter: { condition: service_started }
  volumes:
    - links:/links:ro
    - generated:/etc/rwmon:ro
  # Интервал и адрес проверки берутся из config.toml (файл собирает контейнер config)
  entrypoint: ["/bin/sh", "-c", "set -a; . /etc/rwmon/checkers/$$RWMON_CHECK.env; exec /usr/bin/xray-checker"]
  logging: *logging

services:
  # Собирает конфиги Prometheus, Grafana и проверок из config.toml и завершается
  config:
    build: ./reporter
    image: rwmon-reporter:local
    container_name: rwmon-config
    command: ["render"]
    restart: "no"
    environment:
      PROMETHEUS_PORT: ${PROMETHEUS_PORT:-9090}
      REPORTER_PORT: ${REPORTER_PORT:-9105}
    volumes:
      - ./config.toml:/config/config.toml:ro
      - ./grafana:/src/grafana:ro
      - generated:/generated
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: rwmon-prometheus
    network_mode: host
    restart: unless-stopped
    depends_on:
      config: { condition: service_completed_successfully }
    command:
      - --config.file=/etc/rwmon/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}
      - --web.listen-address=127.0.0.1:${PROMETHEUS_PORT:-9090}
    volumes:
      - generated:/etc/rwmon:ro
      - prometheus-data:/prometheus
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.3
    container_name: rwmon-grafana
    network_mode: host
    restart: unless-stopped
    depends_on:
      config: { condition: service_completed_successfully }
      prometheus: { condition: service_started }
    environment:
      TZ: UTC
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:-3300}
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-localhost}
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN:-localhost}/
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?заполните GRAFANA_ADMIN_USER в .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?заполните GRAFANA_ADMIN_PASSWORD в .env}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_BRUTE_FORCE_LOGIN_PROTECTION_MAX_ATTEMPTS: "5"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: utc
      GF_USERS_DEFAULT_LANGUAGE: ru-RU
      # источник данных, алерты и Telegram — из собранных конфигов
      GF_PATHS_PROVISIONING: /etc/rwmon/grafana
    volumes:
      - generated:/etc/rwmon:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    logging: *logging

  # Метрики панелей, список хостов для проверок, GeoCheck и ежедневная сводка
  reporter:
    build: ./reporter
    image: rwmon-reporter:local
    container_name: rwmon-reporter
    network_mode: host
    restart: unless-stopped
    depends_on:
      config: { condition: service_completed_successfully }
    environment:
      TZ: UTC
      LINKS_FILE: /links/monitor.txt
      LINKS_FILE_XRAY: /links/monitor-xray.txt
      DATA_DIR: /data
      PROMETHEUS_URL: http://127.0.0.1:${PROMETHEUS_PORT:-9090}
      PROMETHEUS_PORT: ${PROMETHEUS_PORT:-9090}
      REPORTER_PORT: ${REPORTER_PORT:-9105}
    volumes:
      - ./config.toml:/config/config.toml:ro
      - links:/links
      - reporter-data:/data
    logging: *logging

  # «Подключение»: нода принимает клиента и выпускает его в интернет напрямую
  # (хосты с тегом host_tag и host_tag_lite всех панелей)
  checker-xray:
    <<: *checker
    container_name: rwmon-checker-xray
    environment: { RWMON_CHECK: xray }

  # «WARP»: адрес, который роутинг ноды отправляет в WARP
  checker-warp:
    <<: *checker
    container_name: rwmon-checker-warp
    environment: { RWMON_CHECK: warp }

  # «Psiphon»: адрес, который роутинг ноды отправляет в Psiphon
  checker-psiphon:
    <<: *checker
    container_name: rwmon-checker-psiphon
    environment: { RWMON_CHECK: psiphon }

volumes:
  prometheus-data:
  grafana-data:
  reporter-data:
  links:
  generated:
