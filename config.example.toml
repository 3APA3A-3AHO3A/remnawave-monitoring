# ─────────────────────────────────────────────────────────────
#  remnawave-monitoring — настройки панелей, Telegram и проверок.
#  cp config.example.toml config.toml && chmod 600 config.toml
#  После изменений:  ./apply.sh
#  Всё время — UTC.
# ─────────────────────────────────────────────────────────────

# Telegram по умолчанию. Можно не заполнять, если у каждой панели свой блок
# [panel.telegram]. Если заполнено — панели без своего блока берут его.
# [telegram]
# bot_token = ""
# chat_id = ""
# topic_id = ""        # ID топика в группе с темами; пусто — общий чат

[schedule]
report_time = "15:00"     # ежедневная сводка
geocheck_time = "14:30"   # GeoCheck всех нод, результат идёт в сводку

[checks]
interval = 300            # как часто проверять хосты, секунд
attempts = 3              # сколько раз пробовать, прежде чем считать проверку неудачной
retry_delay = 5           # пауза между попытками, секунд
concurrency = 20          # сколько хостов проверять одновременно (0 — все сразу)
# Что открываем через ноду:
url_xray = "https://www.google.com/generate_204"        # напрямую (DIRECT)
url_warp = "https://icanhazip.com"                      # домен из geosite:category-ip-geo-detect → WARP
url_psiphon = "http://ip-api.com/line/?fields=query"    # домен, который правилом ноды отправлен в Psiphon

[alerts]
# «Клиенты пропали»: за прошлый час в среднем было не меньше N человек,
# а последние 5 минут на ноде не больше M
clients_drop_min_avg = 3
clients_drop_max_now = 1
# Аутбаунды, трафик которых показывается в сводке и на дашборде
outbound_tags = ["psiphon-out", "WARP"]
# Пока что-то не работает — напоминать в Telegram раз в N минут (сертификат — раз в сутки)
repeat_minutes = 60
# Здоровье самой панели: «тормозит», если задержка процесса дольше 5 минут выше N мс;
# «ест много памяти», если процесс дольше 15 минут занимает больше N МБ
panel_lag_ms = 200
panel_memory_mb = 1024

[geocheck]
bad_countries = ["RU", "BY"]   # подсвечивать, если сервис видит ноду в этих странах
attach_images = true           # картинки GeoCheck в HTML-отчёте
# Сервисы, которые ноды отправляют в WARP / Psiphon, а не напрямую: GeoCheck меряет с IP ноды,
# поэтому их изменения уходят в «мелкие», а «видит RU» по ним не подсвечивается.
# Совпадение по части названия: "ChatGPT" накроет и «ChatGPT (web)», и «ChatGPT (app)».
# routed_services = ["ChatGPT", "Gemini", "NotebookLM", "Claude", "TikTok", "Spotify"]

[report]
short_minutes = 2              # сбои не дольше N минут — в сводке одной строкой «и ещё N коротких»
panel_down_minutes = 5         # API панели недоступен меньше N минут — не сбой (перезагрузка, DNS)

# Внешний сторож: reporter раз в 5 минут открывает этот адрес.
# Если отметки нет — сервис (например, Healthchecks.io) сам напишет, что мониторинг молчит.
[healthcheck]
ping_url = ""

# ─── Сайты ──────────────────────────────────────────────────
# Раз в минуту reporter открывает страницу: работает ли, сколько отвечает,
# сколько осталось до конца сертификата. Если настроены пробы из РФ —
# они тоже проверяют, открывается ли сайт из России.
# [[site]]
# name = "Сайт"
# url = "https://example.com"
# keyword = "Купить"          # необязательно: текст, который должен быть на странице
#
# [[site]]
# name = "Панель"
# url = "https://panel.example.com"
#
# Страница подписки: корень у неё обычно закрыт (404/502). Два варианта:
#  • точнее — ссылка подписки служебного пользователя: проверяется, что подписка реально отдаётся;
#  • проще — any_status: любой HTTP-ответ означает, что сервер жив.
# [[site]]
# name = "Подписка"
# url = "https://sub.example.com"
# any_status = true

# ─── Пробы из РФ ────────────────────────────────────────────
# Blackbox exporter на RU-ноде (папка probe/, установка — probe/install.sh).
# Раз в минуту проверяет, открываются ли из России хосты и сайты.
# install.sh печатает готовый блок — вставьте его сюда.
# [[probe]]
# name = "ru-msk"
# url = "https://203.0.113.10:9115"
# user = "rwmon"
# password = "…"

# ─── Панели ─────────────────────────────────────────────────
# Сколько угодно блоков [[panel]]. Куда что уходит в Telegram:
#   сбои хостов (Подключение / WARP / Psiphon) — в чат своей панели;
#   ноды, GeoCheck, сводка, сбои самого мониторинга — во все чаты.
#
# API-токен (Настройки → API-токены), только чтение:
#   Nodes: Get nodes · Users: Get user by username ·
#   Subscriptions: Get Raw Subscription by Short UUID, Get connection keys by user id ·
#   Connections: Request Geocheck for Node, Get Geocheck for Node by Job ID ·
#   System: Get Stats, Get Nodes Metrics, Get Stats Digest, Get Remnawave Information ·
#   (по желанию) Infra Billing: Get infra billing nodes

[[panel]]
id = "main"                      # латиницей, коротко: попадает в метки графиков
title = "Основная"               # подпись в сообщениях и на графиках
# Панель на этом же сервере — бэкенд напрямую; другая — её домен: "https://panel.example.com"
api_url = "http://127.0.0.1:3000"
api_token = ""
monitor_user = "monitoring"      # служебный пользователь, по его подписке проверяются хосты
host_tag = "MONITORING"          # хосты с этим тегом — все три проверки
host_tag_lite = "MONITORING_LITE"  # только «Подключение» (LTE, лимитированные)
# host_suffix = ""               # подпись к названиям хостов; у первой панели пусто
exclude_nodes = []               # не следить за нодами (имена или теги нод); выключенные в панели скрываются сами
geocheck_exclude = []            # не запускать на них GeoCheck
# headers = { "Cookie" = "..." } # если панель закрыта дополнительной защитой
# Точный трафик по аутбаундам (нужен для алерта «аутбаунд не отвечает»):
# /metrics самой панели — METRICS_PORT и METRICS_USER/METRICS_PASS из .env панели.
# Без этого трафик берётся из API — округлённый, но для графиков и сводки хватает.
# metrics_url = "http://127.0.0.1:3001/metrics"
# metrics_user = ""
# metrics_password = ""
[panel.telegram]
bot_token = ""
chat_id = ""
topic_id = ""

